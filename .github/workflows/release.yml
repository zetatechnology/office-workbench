name: Release

# Push a tag like v0.1.0 (matching packages/extension/package.json) to the development
# repository; mirror.yml forwards it to the public zetatechnology/office-workbench, where this
# workflow builds the VSIX, attaches it to a GitHub release and publishes it. Marketplace /
# Open VSX publishing runs only when the VSCE_PAT / OVSX_PAT repository secrets are set.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    if: github.repository == 'zetatechnology/office-workbench'
    runs-on: ubuntu-latest
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check tag matches version
        run: |
          version=$(node -p "require('./packages/extension/package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $version" >&2
            exit 1
          fi
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run package
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" packages/extension/*.vsix --title "$GITHUB_REF_NAME" --notes-file packages/extension/CHANGELOG.md
      - name: Publish to Visual Studio Marketplace
        if: env.VSCE_PAT != ''
        working-directory: packages/extension
        run: npx vsce publish --no-dependencies --packagePath *.vsix
      - name: Publish to Open VSX
        if: env.OVSX_PAT != ''
        working-directory: packages/extension
        run: npx --yes ovsx publish *.vsix -p "$OVSX_PAT"
