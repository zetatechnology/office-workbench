name: Mirror to public repository

# Development happens in hiroyakubo/office-workbench; main and release tags are mirrored to the
# public zetatechnology/office-workbench, where release.yml builds and publishes tagged versions.
# PUBLIC_REPO_DEPLOY_KEY is the private half of a deploy key with write access to the public repository.
on:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  mirror:
    if: github.repository == 'hiroyakubo/office-workbench'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Push to zetatechnology/office-workbench
        env:
          DEPLOY_KEY: ${{ secrets.PUBLIC_REPO_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/public_repo
          chmod 600 ~/.ssh/public_repo
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/public_repo -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          # No --force: if the public history ever diverges, the push fails instead of overwriting it.
          git push git@github.com:zetatechnology/office-workbench.git "$GITHUB_REF:$GITHUB_REF"
